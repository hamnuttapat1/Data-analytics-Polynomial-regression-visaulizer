<script src="https://unpkg.com/lucide@latest"></script>
<script>lucide.createIcons();</script>

<script>
    // 1. Select all the buttons with the class 'button_purple'
    const buttons = document.querySelectorAll('.button_preset');

    // 2. Add a click event to every button
    buttons.forEach(button => {
        button.addEventListener('click', function () {

            // 3. Remove the 'active' class from ALL buttons first
            buttons.forEach(btn => btn.classList.remove('active'));

            // 4. Add the 'active' class ONLY to the button that was just clicked
            this.classList.add('active');

        });
    });
</script>
